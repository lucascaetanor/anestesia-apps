<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e1a">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anest Pediátrica">
<title>Simulador de Anestesia Pediátrica</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2235;
    --surface3: #1f2d44;
    --accent: #00d4ff;
    --accent2: #00ff9d;
    --warn: #ff6b35;
    --danger: #ff3b3b;
    --text: #e8f0fe;
    --muted: #6b7fa3;
    --border: rgba(0,212,255,0.15);
    --glow: 0 0 20px rgba(0,212,255,0.2);
    --glow2: 0 0 20px rgba(0,255,157,0.2);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Sora', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* HEADER */
  .hero {
    background: linear-gradient(135deg, #0a0e1a 0%, #0d1b2e 50%, #0a1628 100%);
    border-bottom: 1px solid var(--border);
    padding: 40px 24px 32px;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -60px; left: -60px;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(0,212,255,0.07) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero::after {
    content: '';
    position: absolute;
    bottom: -80px; right: 40px;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(0,255,157,0.05) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-inner { max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }
  .badge {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 3px 10px;
    border-radius: 2px;
    margin-bottom: 16px;
  }
  .hero h1 {
    font-size: clamp(24px, 4vw, 42px);
    font-weight: 800;
    line-height: 1.15;
    background: linear-gradient(135deg, #ffffff 0%, var(--accent) 60%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }
  .hero p {
    color: var(--muted);
    font-size: 14px;
    font-weight: 300;
    max-width: 600px;
  }

  /* LAYOUT */
  .container { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }

  /* AXES SECTION */
  .axes-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 32px;
  }
  @media (max-width: 768px) { .axes-grid { grid-template-columns: 1fr; } }

  .axis-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .axis-card:hover { border-color: var(--accent); box-shadow: var(--glow); }
  .axis-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }
  .axis-card.eixo1::before { background: linear-gradient(90deg, var(--accent), transparent); }
  .axis-card.eixo2::before { background: linear-gradient(90deg, var(--warn), transparent); }
  .axis-card.eixo3::before { background: linear-gradient(90deg, var(--accent2), transparent); }

  .axis-num {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .axis-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .axis-card.eixo1 .axis-title { color: var(--accent); }
  .axis-card.eixo2 .axis-title { color: var(--warn); }
  .axis-card.eixo3 .axis-title { color: var(--accent2); }

  .axis-items { list-style: none; }
  .axis-items li {
    font-size: 13px;
    color: var(--muted);
    padding: 2px 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .axis-items li::before {
    content: '›';
    color: var(--accent);
    font-weight: bold;
  }

  /* SECTION TITLE */
  .section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    margin-top: 40px;
  }
  .section-header .icon {
    width: 36px; height: 36px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .section-header h2 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .section-header small {
    display: block;
    font-size: 12px;
    color: var(--muted);
    font-weight: 400;
  }

  /* INPUTS */
  .input-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .input-group label {
    display: block;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
    font-family: 'DM Mono', monospace;
  }
  .input-group input, .input-group select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 15px;
    font-family: 'Sora', sans-serif;
    font-weight: 600;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    -webkit-appearance: none;
  }
  .input-group input:focus, .input-group select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,212,255,0.1);
  }
  .input-group select option { background: var(--surface2); }

  .calc-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--accent), #0099cc);
    border: none;
    border-radius: 10px;
    color: #000;
    font-family: 'Sora', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s;
    margin-bottom: 32px;
  }
  .calc-btn:hover { opacity: 0.9; box-shadow: 0 0 24px rgba(0,212,255,0.4); }
  .calc-btn:active { transform: scale(0.99); }

  /* FISIOLOGIA */
  .physio-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 32px;
  }
  .physio-card {
    background: var(--surface);
    border: 1px solid rgba(255,107,53,0.2);
    border-radius: 10px;
    padding: 16px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .physio-icon { font-size: 22px; flex-shrink: 0; }
  .physio-text { font-size: 12px; color: var(--muted); }
  .physio-text strong { display: block; color: var(--text); font-size: 13px; margin-bottom: 2px; }

  /* RESULTS PANEL */
  .results-panel {
    display: none;
    animation: fadeIn 0.4s ease;
  }
  .results-panel.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  .result-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    position: relative;
  }
  .result-card-title {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .result-card-title span { font-size: 16px; }

  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .result-row:last-child { border-bottom: none; }
  .result-label { font-size: 12px; color: var(--muted); }
  .result-value {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    text-align: right;
  }
  .result-value.accent { color: var(--accent); }
  .result-value.green { color: var(--accent2); }
  .result-value.warn { color: var(--warn); }

  /* ALERTS */
  .alerts-panel {
    background: rgba(255,59,59,0.06);
    border: 1px solid rgba(255,59,59,0.3);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .alerts-title {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--danger);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .alert-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,59,59,0.1);
    font-size: 13px;
    color: #ffaaaa;
  }
  .alert-item:last-child { border-bottom: none; }
  .alert-item .a-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .alert-item.info { color: #ffe0aa; }
  .alert-item.info .a-icon { font-size: 16px; }

  /* FICHA FINAL */
  .ficha-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .ficha-header {
    background: linear-gradient(135deg, var(--surface2), var(--surface3));
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .ficha-header h3 {
    font-size: 16px;
    font-weight: 700;
    background: linear-gradient(90deg, #fff, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .ficha-header small {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }
  .ficha-body { padding: 0; }
  .ficha-section {
    display: grid;
    grid-template-columns: 140px 1fr;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .ficha-section:last-child { border-bottom: none; }
  .ficha-key {
    background: var(--surface2);
    padding: 12px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 6px;
    border-right: 1px solid var(--border);
  }
  .ficha-val {
    padding: 12px 16px;
    font-size: 13px;
    color: var(--text);
    line-height: 1.5;
  }
  .ficha-val strong {
    color: var(--accent2);
    font-family: 'Space Mono', monospace;
  }

  /* VENTILATION VISUAL */
  .vent-visual {
    background: var(--surface2);
    border-radius: 8px;
    padding: 14px;
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .vent-bar-wrap {
    flex: 1;
    min-width: 120px;
  }
  .vent-bar-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; font-family: 'DM Mono', monospace; }
  .vent-bar {
    height: 8px;
    background: var(--surface3);
    border-radius: 4px;
    overflow: hidden;
  }
  .vent-bar-fill {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.5s ease;
  }
  .vent-val {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    margin-top: 2px;
  }

  /* FLUID VIZ */
  .fluid-steps {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .fluid-step {
    flex: 1;
    min-width: 100px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    text-align: center;
  }
  .fluid-step-num {
    font-family: 'Space Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
  }
  .fluid-step-label { font-size: 10px; color: var(--muted); margin-top: 4px; line-height: 1.3; }

  /* DRUG COMPARE TABLE */
  .drug-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 8px;
  }
  .drug-table th {
    background: var(--surface2);
    padding: 10px 12px;
    text-align: left;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .drug-table td {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    vertical-align: top;
  }
  .drug-table tr:last-child td { border-bottom: none; }
  .drug-table td:first-child { color: var(--text); font-weight: 600; }
  .drug-table td:not(:first-child) {
    font-family: 'Space Mono', monospace;
    color: var(--accent2);
  }
  .drug-table tr:hover td { background: rgba(255,255,255,0.02); }

  /* HIDDEN UNTIL CALC */
  .hidden { display: none; }

  /* GATE DE SENHA */
  .gate-overlay {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    padding: 24px;
  }
  .gate-box {
    max-width: 380px;
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 28px;
    text-align: center;
    box-shadow: var(--glow);
  }
  .gate-icon { font-size: 40px; margin-bottom: 12px; }
  .gate-box h2 { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
  .gate-box p { font-size: 12px; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }
  .gate-box input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    color: var(--text);
    font-size: 15px;
    font-family: 'Sora', sans-serif;
    text-align: center;
    letter-spacing: 2px;
    outline: none;
    margin-bottom: 14px;
  }
  .gate-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,212,255,0.1); }
  .gate-box button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, var(--accent), #0099cc);
    border: none;
    border-radius: 10px;
    color: #000;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .gate-box button:hover { opacity: 0.9; }
  .gate-error {
    display: none;
    margin-top: 12px;
    font-size: 12px;
    color: var(--danger);
  }
  .gate-loading {
    margin-top: 12px;
    font-size: 12px;
    color: var(--muted);
  }

  /* ===== CARTÃO DE IMPRESSÃO / PDF — 1 página A4, tema claro ===== */
  .print-card {
    position: fixed;
    left: -99999px;
    top: 0;
    width: 210mm;
    background: #ffffff;
    color: #1a2534;
    font-family: 'Sora', Arial, sans-serif;
    padding: 9mm 10mm;
    box-sizing: border-box;
  }
  .pc-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 3px solid #102033;
    padding-bottom: 3mm;
    margin-bottom: 3mm;
  }
  .pc-title { font-size: 19px; font-weight: 800; color: #102033; letter-spacing: -0.2px; }
  .pc-subtitle { font-size: 9px; color: #7a8794; margin-top: 1px; }
  .pc-meta {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: #1a2534;
    text-align: right;
    line-height: 1.5;
  }
  .pc-meta b { color: #0c7fa8; }
  .pc-alerts {
    background: #fff1ee;
    border: 1.5px solid #e0503a;
    border-radius: 7px;
    padding: 5px 10px;
    font-size: 9.5px;
    color: #7a1e10;
    line-height: 1.5;
    margin-bottom: 3mm;
  }
  .pc-alerts b { color: #d94020; font-size: 10px; }
  .pc-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2.5mm;
  }
  .pc-cell {
    border: 1px solid #dfe7ef;
    border-left: 4px solid var(--pc-c, #2d9cdb);
    border-radius: 6px;
    background: #fbfdff;
    padding: 5px 7px 6px;
  }
  .pc-cell-title {
    font-size: 10.5px;
    font-weight: 800;
    color: #102033;
    margin-bottom: 3px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .pc-cell ul { list-style: none; margin: 0; padding: 0; }
  .pc-cell li {
    font-size: 9px;
    line-height: 1.55;
    color: #33465a;
    padding: 0.5px 0;
  }
  .pc-cell li b {
    color: var(--pc-c, #0c7fa8);
    font-family: 'Space Mono', monospace;
    font-weight: 700;
  }
  .pc-cell li .pc-warn { color: #c23b1f; font-weight: 700; }
  .pc-footer {
    text-align: center;
    font-size: 7.5px;
    color: #9aa7b4;
    margin-top: 3mm;
    border-top: 1px solid #eef2f6;
    padding-top: 2mm;
  }

  @media print {
    body * { visibility: hidden !important; }
    #printCard, #printCard * { visibility: visible !important; }
    #printCard {
      position: absolute !important;
      left: 0 !important;
      top: 0 !important;
      width: 100% !important;
      margin: 0 !important;
    }
    @page { size: A4; margin: 8mm; }
  }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 24px;
    color: var(--muted);
    font-size: 12px;
    border-top: 1px solid var(--border);
    margin-top: 40px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.5px;
  }
  footer a { color: var(--accent); text-decoration: none; }

  /* TABS */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--surface);
    padding: 4px;
    border-radius: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .tab-btn {
    flex: 1;
    min-width: 100px;
    padding: 9px 14px;
    background: none;
    border: none;
    border-radius: 7px;
    color: var(--muted);
    font-family: 'Sora', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .tab-btn.active {
    background: var(--surface2);
    color: var(--accent);
    box-shadow: inset 0 1px 0 rgba(0,212,255,0.2);
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; animation: fadeIn 0.3s ease; }

  /* HIGHLIGHT BOX */
  .highlight-box {
    background: rgba(0,212,255,0.05);
    border: 1px solid rgba(0,212,255,0.2);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
    font-size: 13px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .highlight-box .hb-icon { font-size: 20px; flex-shrink: 0; }
  .highlight-box p { color: var(--muted); line-height: 1.6; }
  .highlight-box strong { color: var(--accent2); }

  /* PRINT btn */
  .print-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 18px;
    color: var(--text);
    font-family: 'Sora', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .print-btn:hover { border-color: var(--accent); color: var(--accent); }

  @media print {
    body { background: white; color: black; }
    .hero, .input-section, .physio-section, .tabs, .calc-btn, .print-btn { display: none !important; }
    .results-panel { display: block !important; }

const __ENC_ITER = 250000;

function __b64ToBuf(b64) {
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf;
}

async function __tentarDesbloquear() {
  const pwd = document.getElementById('gatePassword').value;
  const errEl = document.getElementById('gateError');
  const loadEl = document.getElementById('gateLoading');
  errEl.style.display = 'none';

  if (!pwd) return;

  if (!window.crypto || !window.crypto.subtle) {
    errEl.textContent = 'Seu navegador/contexto não suporta Web Crypto (necessário HTTPS ou arquivo local no Chrome). Tente abrir via um servidor local ou navegador atualizado.';
    errEl.style.display = 'block';
    return;
  }

  loadEl.style.display = 'block';
  try {
    const enc = new TextEncoder();
    const salt = __b64ToBuf(__ENC_SALT);
    const iv = __b64ToBuf(__ENC_IV);
    const data = __b64ToBuf(__ENC_DATA);

    const keyMaterial = await crypto.subtle.importKey(
      'raw', enc.encode(pwd), { name: 'PBKDF2' }, false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: __ENC_ITER, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
    const decryptedBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, data);
    const html = new TextDecoder().decode(decryptedBuf);

    document.getElementById('appRoot').innerHTML = html;
    document.getElementById('appRoot').style.display = 'block';
    document.getElementById('gate').style.display = 'none';
    sessionStorage.setItem('__simuladorUnlocked', '1');
  } catch (e) {
    loadEl.style.display = 'none';
    errEl.textContent = 'Senha incorreta. Tente novamente.';
    errEl.style.display = 'block';
    return;
  }
  loadEl.style.display = 'none';
}

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('gateBtn').addEventListener('click', __tentarDesbloquear);
  document.getElementById('gatePassword').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') __tentarDesbloquear();
  });
  document.getElementById('gatePassword').focus();
});
</script>

<script>
function showTab(id, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

function fmt(v, dec=1) {
  if (isNaN(v)) return '—';
  return v.toFixed(dec);
}

function calcular() {
  const idadeMeses = parseFloat(document.getElementById('idadeMeses').value);
  const peso = parseFloat(document.getElementById('peso').value);
  const altura = parseFloat(document.getElementById('altura').value) || 0;
  const asa = document.getElementById('asa').value;
  const prematuridade = document.getElementById('prematuridade').value;
  const jejum = parseFloat(document.getElementById('jejum').value) || 4;
  const duracao = document.getElementById('duracao').value;
  const nocicep = document.getElementById('nocicep').value;
  const viaAerea = document.getElementById('viaAerea').value;
  const ventTipo = document.getElementById('ventTipo').value;
  const vad = document.getElementById('vad').value;
  const miopatia = document.getElementById('miopatia').value;

  if (isNaN(idadeMeses) || isNaN(peso) || peso <= 0 || idadeMeses < 0) {
    alert('Por favor, insira idade e peso válidos.');
    return;
  }

  const idadeAnos = idadeMeses / 12;
  const isNeonato = idadeMeses < 1;
  const isLactente = idadeMeses >= 1 && idadeMeses < 12;
  const isPreescolar = idadeMeses >= 12 && idadeMeses < 60;
  const isEscolar = idadeMeses >= 60;

  // ---- VIA AEREA ----
  let tubeSC, tubeCC;
  if (isNeonato) {
    tubeSC = peso < 1 ? 2.5 : (peso < 2 ? 3.0 : 3.5);
    tubeCC = tubeSC - 0.5;
  } else if (isLactente) {
    tubeSC = 3.5;
    tubeCC = 3.0;
  } else {
    tubeSC = (idadeAnos / 4) + 4;
    tubeCC = (idadeAnos / 4) + 3.5;
  }
  tubeSC = Math.round(tubeSC * 2) / 2;
  tubeCC = Math.round(tubeCC * 2) / 2;

  document.getElementById('tubeSC').textContent = tubeSC.toFixed(1) + ' mm';
  document.getElementById('tubeCC').textContent = tubeCC.toFixed(1) + ' mm';
  document.getElementById('tubeMin').textContent = (tubeSC - 0.5).toFixed(1) + ' mm';
  document.getElementById('tubeMax').textContent = (tubeSC + 0.5).toFixed(1) + ' mm';

  // Profundidade
  const profM1 = tubeCC * 3;
  const profM2 = idadeAnos / 2 + 12;
  document.getElementById('profM1').textContent = fmt(profM1, 0) + ' cm';
  document.getElementById('profM2').textContent = fmt(profM2, 1) + ' cm';

  // Lâmina
  let lamina, laminaAlt;
  if (isNeonato) { lamina = 'Miller 0'; laminaAlt = 'Miller 00'; }

async function gerarPDF(event) {
  const cardEl = document.getElementById('printCard');
  if (!cardEl || !cardEl.innerHTML.trim()) { alert('Calcule o plano anestésico antes de gerar o PDF.'); return; }
  if (!window.jspdf) { alert('Biblioteca de PDF não carregada. Verifique sua conexão e tente novamente.'); return; }
  if (typeof html2canvas === 'undefined') { alert('Biblioteca de renderização não carregada. Verifique sua conexão e tente novamente.'); return; }

  const btn = event && event.target ? event.target : null;
  const btnTextoOriginal = btn ? btn.textContent : null;
  if (btn) { btn.textContent = '⏳ Gerando...'; btn.disabled = true; }

  try {
    const canvas = await html2canvas(cardEl, { scale: 2.5, backgroundColor: '#ffffff', useCORS: true });
    const imgData = canvas.toDataURL('image/png');

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgHeightMM = (canvas.height * pageWidth) / canvas.width;

    if (imgHeightMM <= pageHeight) {
      // Cabe em 1 página — caso esperado com o layout compacto
      pdf.addImage(imgData, 'PNG', 0, 0, pageWidth, imgHeightMM);
    } else {
      // Rede de segurança: se o conteúdo (ex.: muitos alertas) não couber, divide em páginas
      const pageHeightPx = Math.floor((canvas.width * pageHeight) / pageWidth);
      let renderedPx = 0;
      let first = true;
      while (renderedPx < canvas.height) {
        const sliceH = Math.min(pageHeightPx, canvas.height - renderedPx);
        const slice = document.createElement('canvas');
        slice.width = canvas.width;
        slice.height = sliceH;
        slice.getContext('2d').drawImage(canvas, 0, renderedPx, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
        const sliceData = slice.toDataURL('image/png');
        const sliceHeightMM = (sliceH * pageWidth) / canvas.width;
        if (!first) pdf.addPage();
        pdf.addImage(sliceData, 'PNG', 0, 0, pageWidth, sliceHeightMM);
        renderedPx += sliceH;
        first = false;
      }
    }

    const peso = window.pdfData ? window.pdfData.peso : '';
    const idadeMeses = window.pdfData ? window.pdfData.idadeMeses : '';
    pdf.save(`ficha-anestesica-pediatrica-${idadeMeses}m-${peso}kg.pdf`);
  } catch (err) {
    alert('Não foi possível gerar o PDF. Tente novamente.');
    console.error(err);
  } finally {
    if (btn) { btn.textContent = btnTextoOriginal; btn.disabled = false; }
  }
}
